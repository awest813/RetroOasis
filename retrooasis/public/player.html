<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#071018" />
    <meta name="color-scheme" content="dark" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="RetroOasis" />
    <title>RetroOasis Play</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Sora:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        color-scheme: dark;
        --ro-bg-void: #071018;
        --ro-bg-void-mid: #0c1c28;
        --ro-accent-sega: #2ee6d6;
        --ro-accent-ps: #f0b429;
        --ro-accent: var(--ro-accent-sega);
        --ro-text: #e8eef5;
        --ro-text-dim: #9aabbc;
        --ro-font-display: "Outfit", system-ui, sans-serif;
        --ro-font-ui: "Sora", system-ui, sans-serif;
        --ro-radius: 2px;
      }

      html[data-accent="ps"] {
        --ro-accent: var(--ro-accent-ps);
      }

      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        height: 100dvh;
        background: #000;
        overflow: hidden;
        font-family: var(--ro-font-ui);
      }

      #display {
        width: 100%;
        height: 100%;
      }

      #game {
        width: 100%;
        height: 100%;
      }

      /* Phones held upright draw the game from the top (the on-screen pad sits below it),
         so the game starts under the bar instead of behind it. */
      @media (orientation: portrait) and (pointer: coarse) {
        #display {
          box-sizing: border-box;
          padding-top: calc(max(0.55rem, env(safe-area-inset-top, 0px)) + 2.9rem);
        }
      }

      .ro-play-bar {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        z-index: 50;
        display: flex;
        align-items: center;
        gap: 0.75rem;
        padding:
          max(0.55rem, env(safe-area-inset-top, 0px))
          max(0.85rem, env(safe-area-inset-right, 0px))
          0.55rem
          max(0.85rem, env(safe-area-inset-left, 0px));
        background: linear-gradient(
          180deg,
          color-mix(in srgb, var(--ro-bg-void) 92%, transparent),
          color-mix(in srgb, var(--ro-bg-void) 35%, transparent) 70%,
          transparent
        );
        color: var(--ro-text);
        pointer-events: none;
      }

      .ro-play-bar a,
      .ro-play-bar button {
        pointer-events: auto;
        font: inherit;
        cursor: pointer;
        border: 1px solid var(--ro-accent);
        background: color-mix(in srgb, var(--ro-bg-void) 85%, transparent);
        color: var(--ro-accent);
        padding: 0.35rem 0.7rem;
        text-decoration: none;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        font-size: 0.75rem;
        font-weight: 600;
        border-radius: var(--ro-radius);
      }

      /* Touch screens keep :hover after a tap; only real pointers get the fill. */
      @media (hover: hover) {
        .ro-play-bar a:hover,
        .ro-play-bar button:hover {
          background: var(--ro-accent);
          color: var(--ro-bg-void);
        }
      }

      .ro-play-bar a,
      .ro-play-bar button {
        flex-shrink: 0;
        box-sizing: border-box;
        min-height: 2rem;
        display: inline-flex;
        align-items: center;
      }

      /* The controls toggle reads as secondary beside Exit: a controller icon and Hide / Show. */
      #pad-toggle {
        display: inline-flex;
        align-items: center;
        gap: 0.35rem;
        border-color: color-mix(in srgb, var(--ro-text) 35%, transparent);
        color: var(--ro-text);
      }
      #pad-toggle[hidden] {
        display: none;
      }
      #pad-toggle svg {
        width: 1.05rem;
        height: 1.05rem;
        flex: none;
      }

      .ro-play-title {
        min-width: 0;
        font-size: 0.8rem;
        opacity: 0.85;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      /* On a narrow bar the system / status line gives way first, so the game's name stays readable. */
      .ro-play-meta {
        font-size: 0.7rem;
        opacity: 0.65;
        flex-shrink: 1000;
        min-width: 4.5rem;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      /* On-screen controls (EmulatorJS's touch pad). Taps that miss a button land on the game,
         where a double tap would otherwise zoom the page. */
      html,
      body {
        touch-action: manipulation;
      }

      /* Keep the pad clear of the home indicator and of a notch held sideways. */
      #display .ejs_virtualGamepad_parent {
        bottom: calc(50px + env(safe-area-inset-bottom, 0px));
      }
      #display .ejs_virtualGamepad_left {
        left: calc(10px + env(safe-area-inset-left, 0px));
      }
      #display .ejs_virtualGamepad_right {
        right: calc(10px + env(safe-area-inset-right, 0px));
      }
      #display .ejs_small_screen .ejs_menu_bar {
        padding-bottom: calc(10px + env(safe-area-inset-bottom, 0px));
      }
      #display .ejs_virtualGamepad_top {
        left: env(safe-area-inset-left, 0px);
        right: env(safe-area-inset-right, 0px);
        width: auto;
      }

      /* Phones held sideways: the pad's top corners hold L / R, so the bar sits between the two
         columns, the game menu button joins it, and the columns drop a little for shoulder room. */
      @media (orientation: landscape) and (max-height: 500px) and (pointer: coarse) {
        #display .ejs_virtualGamepad_parent {
          bottom: 50px;
        }
        #display .ejs_virtualGamepad_left,
        #display .ejs_virtualGamepad_right {
          bottom: 30px;
        }
        /* N64 L / Z / R: just under the screen's top edge, above the stick. */
        #display .ejs_virtualGamepad_top {
          bottom: calc(100dvh - 100px);
        }
        body:has(.ejs_virtualGamepad_parent:not([style*="none"])) .ro-play-bar {
          padding-left: calc(150px + env(safe-area-inset-left, 0px));
          padding-right: calc(196px + env(safe-area-inset-right, 0px));
        }
        body:has(.ejs_virtualGamepad_parent:not([style*="none"])) #display .ejs_virtualGamepad_open {
          right: calc(146px + env(safe-area-inset-right, 0px));
        }
      }

      /* Touch screens (phones, tablets, Chromebooks): a 44px hit area around Exit without a taller bar. */
      @media (pointer: coarse), (any-pointer: coarse) {
        .ro-play-bar a,
        .ro-play-bar button { position: relative; }
        .ro-play-bar a::after,
        .ro-play-bar button::after { content: ""; position: absolute; inset: -9px -4px; }
      }

      /* EmulatorJS Netplay, in RetroOasis's look: a centred card over the dimmed game instead of a
         full-screen black sheet. Scoped to popups holding a netplay table, so EmulatorJS's other
         menus are untouched. Some !important: EmulatorJS sets colours with !important and inline. */
      #display .ejs_popup_container:has(.ejs_netplay_table) {
        --np-panel: color-mix(in srgb, var(--ro-bg-void-mid) 92%, var(--ro-accent) 8%);
        --np-line: color-mix(in srgb, var(--ro-accent) 28%, transparent);
        inset: 0;
        margin: auto;
        width: min(34rem, calc(100% - 2rem));
        height: fit-content;
        max-height: calc(100% - 5.5rem);
        overflow: auto;
        padding: 1.25rem 1.25rem 1.1rem;
        border: 1px solid var(--np-line);
        border-radius: 12px;
        background: var(--np-panel);
        box-shadow: 0 0 0 100vmax color-mix(in srgb, var(--ro-bg-void) 78%, transparent), 0 24px 60px rgba(0, 0, 0, 0.5);
        font-family: var(--ro-font-ui);
        text-align: left;
      }
      #display .ejs_popup_container:has(.ejs_netplay_table) * {
        color: var(--ro-text);
        font-family: var(--ro-font-ui);
      }
      #display .ejs_popup_container:has(.ejs_netplay_table) > h4 {
        padding: 0 0 0.85rem;
        font-family: var(--ro-font-display);
        font-size: 1.5rem;
        font-weight: 650;
        letter-spacing: 0.01em;
      }
      #display .ejs_popup_container:has(.ejs_netplay_table) .ejs_popup_body {
        height: auto;
        max-height: none;
        overflow: visible;
      }
      /* Section titles ("Rooms", the room's name, "Chat"): small accent caps, like Settings. */
      #display .ejs_popup_container:has(.ejs_netplay_table) .ejs_popup_body > div > strong,
      #display .ejs_popup_container:has(.ejs_netplay_table) .ejs_netplay_chat_header_row strong {
        display: block;
        margin: 0 0 0.5rem;
        color: var(--ro-accent);
        font-size: 0.75rem;
        font-weight: 650;
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }
      /* Tables: rows as list entries with hairline dividers; the header as quiet caps. */
      #display .ejs_popup_container:has(.ejs_netplay_table) .ejs_netplay_table {
        padding: 0;
        border-collapse: collapse;
        font-size: 0.9375rem;
      }
      #display .ejs_popup_container:has(.ejs_netplay_table) .ejs_netplay_table thead td {
        padding: 0 0 0.4rem;
        color: var(--ro-text-dim);
        font-size: 0.75rem;
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }
      #display .ejs_popup_container:has(.ejs_netplay_table) .ejs_netplay_table tbody td {
        padding: 0.6rem 0 !important;
        border-top: 1px solid var(--np-line);
      }
      #display .ejs_popup_container:has(.ejs_netplay_table) .ejs_netplay_table tbody td:last-child {
        text-align: right;
      }
      #display .ejs_popup_container:has(.ejs_netplay_table) .ejs_netplay_table_row:hover {
        background: color-mix(in srgb, var(--ro-accent) 8%, transparent);
      }
      /* No rooms yet: say so instead of an empty table. */
      #display .ejs_popup_container:has(.ejs_netplay_table) .ejs_netplay_table tbody:empty::after {
        content: "No rooms for this game yet. Create one and send your friend the host app’s address.";
        display: block;
        padding: 0.75rem 0;
        border-top: 1px solid var(--np-line);
        color: var(--ro-text-dim);
        font-size: 0.875rem;
      }
      #display .ejs_popup_container:has(.ejs_netplay_table) .ejs_popup_body > div > div:not([class]) {
        margin: -0.25rem 0 0.5rem;
        color: var(--ro-text-dim);
        font-size: 0.8125rem;
      }
      /* Buttons: RetroOasis shapes. Solid accent for the main action, outline otherwise. */
      #display .ejs_popup_container:has(.ejs_netplay_table) .ejs_button,
      #display .ejs_popup_container:has(.ejs_netplay_table) .ejs_button_button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 40px;
        margin: 0;
        padding: 0.5rem 1rem;
        border: 1px solid var(--ro-accent);
        border-radius: 6px;
        background: transparent !important;
        color: var(--ro-accent) !important;
        font-size: 0.8125rem;
        font-weight: 600;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        transform: none;
      }
      #display .ejs_popup_container:has(.ejs_netplay_table) .ejs_button:first-of-type,
      #display .ejs_popup_container:has(.ejs_netplay_table) .ejs_netplay_join_button,
      #display .ejs_popup_container:has(.ejs_netplay_table) .ejs_popup_submit:first-of-type,
      #display .ejs_popup_container:has(.ejs_netplay_table) .ejs_netplay_chat_row .ejs_button_button {
        background: var(--ro-accent) !important;
        color: var(--ro-bg-void) !important;
      }
      #display .ejs_popup_container:has(.ejs_netplay_table) .ejs_netplay_join_button {
        min-height: 34px;
        padding: 0.3rem 0.9rem;
      }
      /* "Leave Room" is the first link while in a room: destructive, so red outline. */
      #display .ejs_popup_container:has(.ejs_netplay_table):has(.ejs_netplay_table tbody tr:not(.ejs_netplay_table_row)) > a.ejs_button:first-of-type {
        border-color: #ff4d6d;
        background: color-mix(in srgb, #ff4d6d 14%, transparent) !important;
        color: #ff4d6d !important;
      }
      #display .ejs_popup_container:has(.ejs_netplay_table) > a.ejs_button {
        margin: 0.75rem 0.5rem 0 0;
      }
      #display .ejs_popup_container:has(.ejs_netplay_table) .ejs_button:focus-visible,
      #display .ejs_popup_container:has(.ejs_netplay_table) .ejs_button_button:focus-visible {
        outline: 2px solid var(--ro-accent);
        outline-offset: 3px;
      }
      /* Inputs and selects, as in the app. */
      #display .ejs_popup_container:has(.ejs_netplay_table) input[type="text"],
      #display .ejs_popup_container:has(.ejs_netplay_table) select {
        height: 40px;
        padding: 0 0.7rem;
        border: 1px solid var(--np-line) !important;
        border-radius: 6px;
        background: color-mix(in srgb, var(--ro-bg-void) 85%, transparent) !important;
        color: var(--ro-text) !important;
        font-family: var(--ro-font-ui) !important;
        font-size: 0.9375rem;
        user-select: text;
      }
      #display .ejs_popup_container:has(.ejs_netplay_table) input[type="text"]:focus,
      #display .ejs_popup_container:has(.ejs_netplay_table) select:focus {
        outline: none;
        border-color: var(--ro-accent) !important;
      }
      /* Chat. */
      #display .ejs_popup_container:has(.ejs_netplay_table) .ejs_netplay_chat_container {
        margin-top: 1rem !important;
        padding-top: 0.85rem;
        border-top: 1px solid var(--np-line);
      }
      #display .ejs_popup_container:has(.ejs_netplay_table) .ejs_netplay_chat_header_row {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
      }
      #display .ejs_popup_container:has(.ejs_netplay_table) .ejs_netplay_chat_hint {
        color: var(--ro-text-dim);
        font-size: 0.75rem;
      }
      #display .ejs_popup_container:has(.ejs_netplay_table) .ejs_netplay_chat_log {
        min-height: 5rem;
        max-height: 9rem;
        border: 1px solid var(--np-line);
        border-radius: 6px;
        background: color-mix(in srgb, var(--ro-bg-void) 70%, transparent);
        font-size: 0.875rem;
        user-select: text;
      }
      /* Recipient, message and Send share the row; the message field gives way on phones. */
      #display .ejs_popup_container:has(.ejs_netplay_table) .ejs_netplay_chat_row {
        display: flex;
        gap: 0.5rem;
        min-width: 0;
      }
      #display .ejs_popup_container:has(.ejs_netplay_table) .ejs_netplay_chat_to {
        flex: 0 1 auto;
        min-width: 0;
        max-width: 9rem;
      }
      #display .ejs_popup_container:has(.ejs_netplay_table) .ejs_netplay_chat_input {
        flex: 1 1 6rem;
        min-width: 0;
        width: auto;
      }
      #display .ejs_popup_container:has(.ejs_netplay_table) .ejs_netplay_chat_row .ejs_button_button {
        flex: none;
        min-width: 0 !important;
        height: 40px !important;
      }
      #display .ejs_popup_container:has(.ejs_netplay_table) .ejs_cheat_parent > br {
        display: none;
      }
      /* Name and Create-a-room dialogs: a card of their own over the dimmed page. */
      #display .ejs_popup_container:has(.ejs_netplay_table) .ejs_popup_container_box {
        position: fixed;
        z-index: 2;
        background: color-mix(in srgb, var(--ro-bg-void) 80%, transparent);
      }
      #display .ejs_popup_container:has(.ejs_netplay_table) .ejs_cheat_parent {
        display: grid;
        gap: 0.75rem;
        width: min(24rem, calc(100vw - 2rem));
        padding: 1.25rem;
        border: 1px solid var(--np-line);
        border-radius: 12px;
        background: var(--np-panel);
        box-shadow: 0 24px 60px rgba(0, 0, 0, 0.5);
        text-align: left;
      }
      #display .ejs_popup_container:has(.ejs_netplay_table) .ejs_netplay_name_heading {
        color: var(--ro-text) !important;
        font-family: var(--ro-font-display);
        font-size: 1.25rem;
        font-weight: 650 !important;
      }
      #display .ejs_popup_container:has(.ejs_netplay_table) .ejs_netplay_header {
        display: grid;
        gap: 0.35rem;
        margin: 0;
      }
      #display .ejs_popup_container:has(.ejs_netplay_table) .ejs_netplay_header br {
        display: none;
      }
      #display .ejs_popup_container:has(.ejs_netplay_table) .ejs_netplay_header strong {
        margin-top: 0.4rem;
        color: var(--ro-text-dim);
        font-size: 0.8125rem;
        font-weight: 600;
      }
      #display .ejs_popup_container:has(.ejs_netplay_table) .ejs_netplay_header input,
      #display .ejs_popup_container:has(.ejs_netplay_table) .ejs_netplay_header select {
        width: 100%;
        max-width: none;
      }
      /* Create a room: its two buttons sit side by side under the fields. */
      #display .ejs_popup_container:has(.ejs_netplay_table) .ejs_cheat_parent:has(> .ejs_popup_submit) {
        grid-template-columns: 1fr 1fr;
      }
      #display .ejs_popup_container:has(.ejs_netplay_table) .ejs_cheat_parent > :not(.ejs_popup_submit) {
        grid-column: 1 / -1;
      }
      #display .ejs_popup_container:has(.ejs_netplay_table) .ejs_cheat_parent > div:last-child,
      #display .ejs_popup_container:has(.ejs_netplay_table) .ejs_cheat_parent > .ejs_popup_submit {
        margin: 0.25rem 0 0 !important;
      }
      #display .ejs_popup_container:has(.ejs_netplay_table) .ejs_cheat_parent > div:last-child {
        gap: 0.5rem !important;
      }
      #display .ejs_popup_container:has(.ejs_netplay_table) .ejs_cheat_parent > div:last-child {
        justify-content: flex-start !important;
      }

      /* Controller pause menu: the Home button, or holding Select + Start, from the couch. */
      .ro-pad-menu {
        position: fixed;
        inset: 0;
        z-index: 10001;
        display: grid;
        place-items: center;
        background: color-mix(in srgb, var(--ro-bg-void) 72%, transparent);
        backdrop-filter: blur(3px);
      }
      .ro-pad-menu[hidden] {
        display: none;
      }
      .ro-pad-menu__card {
        display: grid;
        gap: 0.75rem;
        min-width: min(18rem, calc(100vw - 2rem));
        padding: 1.25rem 1.25rem 1rem;
        border: 1px solid var(--ro-accent);
        border-radius: 12px;
        background: color-mix(in srgb, var(--ro-bg-void) 94%, transparent);
        text-align: center;
      }
      .ro-pad-menu h2 {
        margin: 0 0 0.25rem;
        font-family: var(--ro-font-display);
        font-size: 1.25rem;
        font-weight: 650;
        color: var(--ro-text);
      }
      .ro-pad-menu button {
        min-height: 44px;
        padding: 0.5rem 1rem;
        border: 1px solid color-mix(in srgb, var(--ro-accent) 55%, transparent);
        border-radius: 6px;
        background: transparent;
        color: var(--ro-text);
        font: inherit;
        font-size: 0.875rem;
        font-weight: 600;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        cursor: pointer;
      }
      .ro-pad-menu button:focus,
      .ro-pad-menu button[data-current] {
        outline: none;
        background: var(--ro-accent);
        border-color: var(--ro-accent);
        color: var(--ro-bg-void);
      }
      .ro-pad-menu__hint {
        margin: 0.25rem 0 0;
        font-size: 0.75rem;
        color: var(--ro-text-dim);
      }

      .ro-play-hint {
        position: fixed;
        left: 50%;
        bottom: max(1rem, env(safe-area-inset-bottom, 0px));
        transform: translateX(-50%);
        z-index: 10000;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: center;
        gap: 0.5rem 0.9rem;
        max-width: min(34rem, calc(100vw - 2rem));
        padding: 0.6rem 0.9rem;
        border: 1px solid var(--ro-accent);
        border-radius: 12px;
        background: color-mix(in srgb, var(--ro-bg-void) 92%, transparent);
        color: var(--ro-text);
        font-size: 0.82rem;
        line-height: 1.4;
        text-align: center;
      }

      @media (pointer: coarse) {
        .ro-play-hint {
          bottom: auto;
          top: calc(4rem + env(safe-area-inset-top, 0px));
        }
      }

      .ro-play-hint button {
        min-height: 44px;
        padding: 0.4rem 0.9rem;
        border: 1px solid var(--ro-accent);
        border-radius: 999px;
        background: transparent;
        color: var(--ro-accent);
        font: inherit;
        font-size: 0.75rem;
        font-weight: 600;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        cursor: pointer;
      }

      .ro-play-hint button:focus-visible {
        outline: 2px solid var(--ro-accent);
        outline-offset: 3px;
      }

      .ro-play-error {
        position: absolute;
        inset: 0;
        display: grid;
        place-content: center;
        gap: 1rem;
        padding: 2rem;
        text-align: center;
        color: var(--ro-text);
        background:
          radial-gradient(ellipse at center, var(--ro-bg-void-mid) 0%, var(--ro-bg-void) 70%),
          var(--ro-bg-void);
      }

      .ro-play-error h1 {
        margin: 0;
        font-family: var(--ro-font-display);
        font-size: clamp(1.05rem, 2.5vw, 1.35rem);
        font-weight: 650;
        color: var(--ro-accent);
        line-height: 1.4;
        letter-spacing: 0.04em;
      }

      .ro-play-error p {
        margin: 0;
        max-width: 32rem;
        color: var(--ro-text-dim);
      }

      .ro-play-error code {
        color: var(--ro-accent);
      }

      .ro-play-error a {
        color: var(--ro-accent);
        text-decoration: none;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        font-size: 0.78rem;
        font-weight: 600;
      }

      .ro-play-error a:hover,
      .ro-play-error button:hover {
        text-decoration: underline;
      }

      .ro-play-error a.ro-play-error__back {
        justify-self: center;
        padding: 0.5rem 1.1rem;
        border: 1px solid var(--ro-accent);
        border-radius: 999px;
      }

      .ro-play-error__actions {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        align-items: center;
        gap: 0.75rem 1.5rem;
      }

      .ro-play-error button {
        padding: 0.5rem 0.9rem;
        border: 1px solid var(--ro-accent);
        border-radius: 999px;
        background: transparent;
        color: var(--ro-accent);
        font: inherit;
        font-size: 0.78rem;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        cursor: pointer;
      }

      .ro-play-loading {
        position: absolute;
        inset: 0;
        display: grid;
        place-content: center;
        gap: 0.85rem;
        padding: 2rem;
        text-align: center;
        color: var(--ro-text);
        background:
          radial-gradient(ellipse at center, var(--ro-bg-void-mid) 0%, var(--ro-bg-void) 70%),
          var(--ro-bg-void);
      }

      .ro-play-loading p {
        margin: 0;
        color: var(--ro-text-dim);
        font-size: 0.92rem;
      }

      .ro-play-loading__bar {
        width: min(12rem, 55vw);
        height: 3px;
        margin: 0 auto;
        border-radius: 999px;
        background: color-mix(in srgb, var(--ro-text) 12%, transparent);
        overflow: hidden;
      }

      .ro-play-loading__bar > span {
        display: block;
        width: 40%;
        height: 100%;
        background: var(--ro-accent);
        animation: ro-play-load 1.1s ease-in-out infinite;
      }

      @keyframes ro-play-load {
        0% { transform: translateX(-120%); }
        100% { transform: translateX(320%); }
      }

      .ro-play-bar a:focus-visible,
      .ro-play-error a:focus-visible,
      .ro-play-error button:focus-visible {
        outline: 2px solid var(--ro-accent);
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <div class="ro-play-bar">
      <a id="back" href="./#/">Exit</a>
      <button type="button" id="pad-toggle" hidden aria-pressed="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M7 7h10a5 5 0 0 1 4.8 6.4l-1 3.4a2.4 2.4 0 0 1-4.2.8L14.5 15h-5l-2.1 2.6a2.4 2.4 0 0 1-4.2-.8l-1-3.4A5 5 0 0 1 7 7z"/><path d="M8 9.8v3.4M6.3 11.5h3.4"/></svg><span>Hide</span></button>
      <span class="ro-play-title" id="title"></span>
      <span class="ro-play-meta" id="meta"></span>
    </div>
    <div id="display"><div id="game"></div></div>
    <div id="pad-menu" class="ro-pad-menu" hidden role="dialog" aria-modal="true" aria-labelledby="pad-menu-title">
      <div class="ro-pad-menu__card">
        <h2 id="pad-menu-title">Paused</h2>
        <button type="button" data-pad-act="resume">Resume</button>
        <button type="button" data-pad-act="exit">Exit game</button>
        <p class="ro-pad-menu__hint">A chooses · B resumes</p>
      </div>
    </div>
    <script>
      (function () {
        // EmulatorJS asks to keep the screen awake and doesn't handle a refusal (battery
        // saver, some browsers); the game runs the same either way.
        window.addEventListener("unhandledrejection", function (event) {
          if (/wake lock/i.test(String(event.reason && event.reason.message))) event.preventDefault();
        });
        try {
          var storedAccent = localStorage.getItem("retrooasis.accent");
          document.documentElement.dataset.accent = storedAccent === "ps" ? "ps" : "sega";
        } catch (_) {
          document.documentElement.dataset.accent = "sega";
        }

        const THREADED = new Set(["ppsspp", "psp", "dosbox_pure", "dos", "azahar", "3ds"]);
        const PATHS = {
          local: "data/",
          stable: "https://cdn.emulatorjs.org/stable/data/",
          latest: "https://cdn.emulatorjs.org/latest/data/",
          nightly: "https://cdn.emulatorjs.org/nightly/data/",
        };
        const DB_NAME = "retrooasis";
        const DB_VERSION = 3;
        const PENDING_ROM_STORE = "pendingRoms";
        const LIBRARY_ROM_STORE = "libraryRoms";
        const IDB_ROM_PREFIX = "idb:";
        const LIBRARY_ROM_PREFIX = "library:";

        const params = new URLSearchParams(window.location.search);
        const romParam = params.get("rom") || "";
        let core = params.get("core") || "";
        const name = params.get("name") || "Game";
        const bios = params.get("bios") || "";
        function sanitizeBack(raw) {
          if (!raw) return "./#/";
          var cleaned = String(raw).replace(/[\x00-\x20\x7f]/g, "");
          var lower = cleaned.toLowerCase();
          if (
            lower.indexOf("javascript:") === 0 ||
            lower.indexOf("vbscript:") === 0 ||
            lower.indexOf("data:") === 0 ||
            lower.indexOf("file:") === 0 ||
            lower.indexOf("blob:") === 0
          ) {
            return "./#/";
          }
          if (cleaned.indexOf("//") === 0 || /^[a-z][a-z0-9+.-]*:/i.test(cleaned)) {
            return "./#/";
          }
          if (cleaned.charAt(0) === "#") return "./" + cleaned;
          if (cleaned.indexOf("./#") === 0 || cleaned.indexOf("/#") === 0) return cleaned;
          return "./#/";
        }
        var back = sanitizeBack(params.get("back"));
        let channel = params.get("channel") || "stable";
        if (!PATHS[channel]) channel = "stable";

        // Common names that aren't EmulatorJS systems ("gbc" runs on the gb core); an unknown name
        // would otherwise fail as a missing download and wrongly blame the connection.
        var CORE_ALIASES = { gbc: "gb", gameboy: "gb", gameboycolor: "gb", genesis: "segaMD", megadrive: "segaMD", md: "segaMD", mastersystem: "segaMS", sms: "segaMS", gamegear: "segaGG", gg: "segaGG", ps1: "psx", playstation: "psx", sfc: "snes", superfamicom: "snes", famicom: "nes", fc: "nes" };
        if (Object.prototype.hasOwnProperty.call(CORE_ALIASES, core.toLowerCase())) core = CORE_ALIASES[core.toLowerCase()];
        if (core === "psp") core = "ppsspp";
        if (core === "dos") core = "dosbox_pure";
        if (core === "3ds") core = "azahar";

        const needsThreads = THREADED.has(core);
        // PSP / PPSSPP, DOS, and 3DS need nightly CDN builds (stable lacks these cores).
        if (needsThreads && channel !== "local") channel = "nightly";

        const CHANNEL_LABELS = {
          local: "Local",
          stable: "Stable",
          latest: "Latest",
          nightly: "Nightly",
        };
        // The default (Stable) file source goes unsaid; others, and hosting, are shown.
        const channelLabel = params.get("lanhost") === "1" ? "Online room" : channel === "stable" ? "" : CHANNEL_LABELS[channel] || channel;
        // People-facing system names for the top bar (the core key stays internal).
        const SYSTEM_NAMES = { nes: "NES", snes: "SNES", gb: "Game Boy", gba: "Game Boy Advance", nds: "Nintendo DS", n64: "Nintendo 64", vb: "Virtual Boy", psx: "PlayStation", psp: "PSP", segaMD: "Genesis", segaMS: "Master System", segaGG: "Game Gear", segaCD: "Sega CD", sega32x: "32X", segaSaturn: "Saturn", arcade: "Arcade", mame2003: "Arcade", atari2600: "Atari 2600", atari7800: "Atari 7800", lynx: "Lynx", jaguar: "Jaguar", pce: "PC Engine", ngp: "Neo Geo Pocket", ws: "WonderSwan", dos: "DOS", dosbox_pure: "DOS", ppsspp: "PSP", "3ds": "3DS", azahar: "3DS" };
        const metaPrefix = (SYSTEM_NAMES[core] || core) + (channelLabel ? " · " + channelLabel : "");

        const dataPath = PATHS[channel];
        document.getElementById("title").textContent = name;
        document.getElementById("meta").textContent = metaPrefix;
        document.getElementById("back").setAttribute("href", back);
        document.title = name + " · RetroOasis";

        function fail(title, message, domMessage, actions) {
          var display = document.getElementById("display");
          display.textContent = ""; // clear
          // The bar shouldn't keep saying "loading…" under an error.
          var meta = document.getElementById("meta");
          if (/ · (loading|starting)…$/.test(meta.textContent)) meta.textContent = metaPrefix + " · couldn’t load";

          var container = document.createElement("div");
          container.className = "ro-play-error";

          var h1 = document.createElement("h1");
          h1.textContent = title;

          var p = document.createElement("p");
          if (domMessage) {
            p.appendChild(domMessage);
          } else {
            p.textContent = message;
          }

          var a = document.createElement("a");
          a.href = back;
          a.textContent = "Back";

          container.appendChild(h1);
          container.appendChild(p);
          if (actions && actions.length) {
            var row = document.createElement("div");
            row.className = "ro-play-error__actions";
            actions.forEach(function (action) {
              var button = document.createElement("button");
              button.type = "button";
              button.textContent = action.label;
              button.addEventListener("click", action.run);
              row.appendChild(button);
            });
            row.appendChild(a);
            container.appendChild(row);
            display.appendChild(container);
            row.querySelector("button").focus({ preventScroll: true });
            return;
          }
          // Back is the only way on: give it a real button shape and focus,
          // so Enter or a controller's A button gets you out.
          a.className = "ro-play-error__back";
          container.appendChild(a);
          display.appendChild(container);
          a.focus({ preventScroll: true });
        }

        function showLoading(message) {
          var display = document.getElementById("display");
          display.textContent = "";

          var container = document.createElement("div");
          container.className = "ro-play-loading";
          container.setAttribute("role", "status");
          container.setAttribute("aria-live", "polite");

          var p = document.createElement("p");
          p.textContent = message;

          var bar = document.createElement("div");
          bar.className = "ro-play-loading__bar";
          bar.setAttribute("aria-hidden", "true");

          var span = document.createElement("span");
          bar.appendChild(span);

          container.appendChild(p);
          container.appendChild(bar);
          display.appendChild(container);
        }

        function openDb() {
          return new Promise(function (resolve, reject) {
            var req = indexedDB.open(DB_NAME, DB_VERSION);
            req.onupgradeneeded = function () {
              var db = req.result;
              if (!db.objectStoreNames.contains("handles")) {
                db.createObjectStore("handles");
              }
              if (!db.objectStoreNames.contains(PENDING_ROM_STORE)) {
                db.createObjectStore(PENDING_ROM_STORE);
              }
              if (!db.objectStoreNames.contains(LIBRARY_ROM_STORE)) {
                db.createObjectStore(LIBRARY_ROM_STORE);
              }
            };
            req.onsuccess = function () {
              resolve(req.result);
            };
            req.onerror = function () {
              reject(req.error || new Error("IndexedDB open failed"));
            };
          });
        }

        function takeStagedRom(romRef) {
          var key = romRef.slice(IDB_ROM_PREFIX.length);
          return openDb().then(function (db) {
            return new Promise(function (resolve, reject) {
              var tx = db.transaction(PENDING_ROM_STORE, "readwrite");
              var store = tx.objectStore(PENDING_ROM_STORE);
              var getReq = store.get(key);
              getReq.onsuccess = function () {
                var record = getReq.result;
                if (!record || !record.bytes) {
                  reject(new Error("This play session expired. Go back and press Play again."));
                  return;
                }
                store.delete(key);
                resolve(
                  new File([record.bytes], record.filename || "game.bin", {
                    type: record.type || "application/octet-stream",
                  }),
                );
              };
              getReq.onerror = function () {
                reject(getReq.error || new Error("IndexedDB read failed"));
              };
              tx.oncomplete = function () {
                db.close();
              };
            });
          });
        }

        function readLibraryRom(romRef) {
          var key = romRef.slice(LIBRARY_ROM_PREFIX.length);
          return openDb().then(function (db) {
            return new Promise(function (resolve, reject) {
              var tx = db.transaction(LIBRARY_ROM_STORE, "readonly");
              var store = tx.objectStore(LIBRARY_ROM_STORE);
              var getReq = store.get(key);
              getReq.onsuccess = function () {
                var record = getReq.result;
                if (!record || !record.bytes) {
                  reject(
                    new Error(
                      "That saved ROM isn’t on this device anymore. Go back and add it again from Add ROM.",
                    ),
                  );
                  return;
                }
                resolve(
                  new File([record.bytes], record.filename || "game.bin", {
                    type: record.type || "application/octet-stream",
                  }),
                );
              };
              getReq.onerror = function () {
                reject(getReq.error || new Error("IndexedDB read failed"));
              };
              tx.oncomplete = function () {
                db.close();
              };
            });
          });
        }

        function parseDiscRefs(filename, text) {
          var ext = (filename.split(".").pop() || "").toLowerCase();
          var names = [];
          if (ext === "m3u") {
            text.split(/\r?\n/).forEach(function (raw) {
              var line = raw.trim();
              if (line && line.charAt(0) !== "#") names.push(line.replace(/\\/g, "/"));
            });
            return names;
          }
          if (ext !== "cue" && ext !== "ccd" && ext !== "toc") return names;
          var re = /^\s*FILE\s+(?:"([^"]+)"|'([^']+)'|(\S+))\s+/gim;
          var match;
          while ((match = re.exec(text))) {
            var name = (match[1] || match[2] || match[3] || "").trim();
            if (name) names.push(name.replace(/\\/g, "/"));
          }
          return names;
        }

        function crc32(data) {
          var table = crc32.table;
          if (!table) {
            table = new Uint32Array(256);
            for (var i = 0; i < 256; i++) {
              var c = i;
              for (var k = 0; k < 8; k++) c = c & 1 ? 0xedb88320 ^ (c >>> 1) : c >>> 1;
              table[i] = c >>> 0;
            }
            crc32.table = table;
          }
          var crc = 0xffffffff;
          for (var n = 0; n < data.length; n++) crc = table[(crc ^ data[n]) & 0xff] ^ (crc >>> 8);
          return (crc ^ 0xffffffff) >>> 0;
        }

        function u16(n) {
          return new Uint8Array([n & 0xff, (n >>> 8) & 0xff]);
        }
        function u32(n) {
          return new Uint8Array([n & 0xff, (n >>> 8) & 0xff, (n >>> 16) & 0xff, (n >>> 24) & 0xff]);
        }
        function concatBytes(parts) {
          var total = 0;
          for (var i = 0; i < parts.length; i++) total += parts[i].length;
          var out = new Uint8Array(total);
          var at = 0;
          for (var j = 0; j < parts.length; j++) {
            out.set(parts[j], at);
            at += parts[j].length;
          }
          return out;
        }

        function buildStoreZip(entries) {
          var encoder = new TextEncoder();
          var locals = [];
          var centrals = [];
          var offset = 0;
          var now = new Date();
          var time = (now.getHours() << 11) | (now.getMinutes() << 5) | Math.floor(now.getSeconds() / 2);
          var date = ((Math.max(1980, now.getFullYear()) - 1980) << 9) | ((now.getMonth() + 1) << 5) | now.getDate();
          for (var i = 0; i < entries.length; i++) {
            var nameBytes = encoder.encode(entries[i].name);
            var bytes = entries[i].bytes;
            var crc = crc32(bytes);
            var size = bytes.byteLength;
            var local = concatBytes([
              encoder.encode("PK\x03\x04"),
              u16(20),
              u16(0),
              u16(0),
              u16(time),
              u16(date),
              u32(crc),
              u32(size),
              u32(size),
              u16(nameBytes.length),
              u16(0),
              nameBytes,
              bytes,
            ]);
            var central = concatBytes([
              encoder.encode("PK\x01\x02"),
              u16(20),
              u16(20),
              u16(0),
              u16(0),
              u16(time),
              u16(date),
              u32(crc),
              u32(size),
              u32(size),
              u16(nameBytes.length),
              u16(0),
              u16(0),
              u16(0),
              u16(0),
              u32(0),
              u32(offset),
              nameBytes,
            ]);
            locals.push(local);
            centrals.push(central);
            offset += local.byteLength;
          }
          var centralDir = concatBytes(centrals);
          var eocd = concatBytes([
            encoder.encode("PK\x05\x06"),
            u16(0),
            u16(0),
            u16(entries.length),
            u16(entries.length),
            u32(centralDir.byteLength),
            u32(offset),
            u16(0),
          ]);
          return concatBytes(locals.concat([centralDir, eocd]));
        }

        function fetchAsFile(url) {
          return fetch(url, { method: "GET", cache: "no-store" }).then(function (res) {
            if (!res.ok) return null;
            var type = (res.headers.get("content-type") || "").toLowerCase();
            if (type.indexOf("text/html") === 0) return null;
            return res.arrayBuffer().then(function (bytes) {
              var filename = decodeURIComponent(url.split("/").pop().split("?")[0] || "track.bin");
              return new File([bytes], filename, { type: type || "application/octet-stream" });
            });
          }).catch(function () {
            return null;
          });
        }

        function discLeaf(name) {
          return (name || "").replace(/\\/g, "/").split("/").pop() || name;
        }

        function maybeBundleHostedDisc(rom, primary) {
          var ext = (primary.name.split(".").pop() || "").toLowerCase();
          if (ext !== "cue" && ext !== "ccd" && ext !== "m3u" && ext !== "toc") {
            return Promise.resolve(primary);
          }
          var dir = rom.split("?")[0];
          var slash = dir.lastIndexOf("/");
          dir = slash >= 0 ? dir.slice(0, slash + 1) : "./";
          var seen = {};
          var extras = [];
          var missing = [];

          function walk(filename, text) {
            var refs = parseDiscRefs(filename, text);
            var next = [];
            refs.forEach(function (ref) {
              var leaf = discLeaf(ref);
              if (!leaf) return;
              var key = leaf.toLowerCase();
              if (key === primary.name.toLowerCase() || seen[key]) return;
              seen[key] = true;
              next.push(leaf);
            });
            if (!next.length) return Promise.resolve();
            return Promise.all(
              next.map(function (leaf) {
                return fetchAsFile(dir + encodeURIComponent(leaf)).then(function (file) {
                  return { leaf: leaf, file: file };
                });
              }),
            ).then(function (results) {
              var nested = [];
              results.forEach(function (result) {
                if (!result.file) {
                  missing.push(result.leaf);
                  return;
                }
                extras.push(result.file);
                var childExt = (result.file.name.split(".").pop() || "").toLowerCase();
                if (childExt === "cue" || childExt === "ccd" || childExt === "m3u" || childExt === "toc") {
                  nested.push(result.file);
                }
              });
              return nested.reduce(function (chain, file) {
                return chain.then(function () {
                  if (file.size > 2000000) return;
                  return file.text().then(function (text) {
                    return walk(file.name, text);
                  });
                });
              }, Promise.resolve());
            });
          }

          return primary.text().then(function (text) {
            return walk(primary.name, text).then(function () {
              if (missing.length) {
                var list = missing.slice(0, 4).join(", ");
                var extra = missing.length > 4 ? " (+" + (missing.length - 4) + " more)" : "";
                return Promise.reject(
                  new Error(primary.name + " also needs " + list + extra + ". Host those files next to this one."),
                );
              }
              if (!extras.length) return primary;
              return Promise.all(
                [primary].concat(extras).map(function (file) {
                  return file.arrayBuffer().then(function (buf) {
                    return { name: file.name, bytes: new Uint8Array(buf) };
                  });
                }),
              ).then(function (zipEntries) {
                var zip = buildStoreZip(zipEntries);
                var zipName = primary.name.replace(/\.[^.]+$/, "") + ".zip";
                return new File([zip], zipName, { type: "application/zip" });
              });
            });
          });
        }

        function resolveRom(rom) {
          if (!rom) return Promise.reject(new Error("Missing game file. Go back and try again."));
          // Dead blob URLs from a previous document cannot be fetched after navigation.
          if (rom.indexOf("blob:") === 0) {
            return Promise.reject(
              new Error("This play session expired. Go back and press Play again."),
            );
          }
          if (rom.indexOf(IDB_ROM_PREFIX) === 0) {
            return takeStagedRom(rom);
          }
          if (rom.indexOf(LIBRARY_ROM_PREFIX) === 0) {
            return readLibraryRom(rom);
          }
          // Hosted / relative paths: fail fast with a clear message instead of EmulatorJS "Network Error".
          return fetch(rom, { method: "GET", cache: "no-store" }).then(function (res) {
            if (!res.ok) {
              var err = new Error("Couldn’t find that ROM file.");
              var frag = document.createDocumentFragment();
              frag.appendChild(document.createTextNode("Couldn’t find that ROM file"));
              if (rom) {
                frag.appendChild(document.createTextNode(" at "));
                var code = document.createElement("code");
                code.textContent = rom;
                frag.appendChild(code);
              }
              frag.appendChild(document.createTextNode(". Host it with your site, link a folder, or use Add ROM."));
              err.domMessage = frag;
              throw err;
            }
            var type = (res.headers.get("content-type") || "").toLowerCase();
            if (type.indexOf("text/html") === 0) {
              var errType = new Error("That path isn’t a ROM file — the server sent a web page instead.");
              var fragType = document.createDocumentFragment();
              fragType.appendChild(document.createTextNode("That path isn’t a ROM file — the server sent a web page instead"));
              if (rom) {
                fragType.appendChild(document.createTextNode(" ("));
                var codeType = document.createElement("code");
                codeType.textContent = rom;
                fragType.appendChild(codeType);
                fragType.appendChild(document.createTextNode(")"));
              }
              fragType.appendChild(document.createTextNode(". Check that the file is hosted in the right place."));
              errType.domMessage = fragType;
              throw errType;
            }
            return res.arrayBuffer().then(function (bytes) {
              var filename = rom.split("/").pop().split("?")[0] || "game.bin";
              var file = new File([bytes], decodeURIComponent(filename), {
                type: type || "application/octet-stream",
              });
              return maybeBundleHostedDisc(rom, file);
            });
          });
        }

        // A BIOS the person added on the game page lives in IndexedDB; hand it over as a File.
        var biosFile = null;
        function resolveBios() {
          if (bios.indexOf("bios:") !== 0) return Promise.resolve(null);
          return openDb().then(function (db) {
            return new Promise(function (resolve) {
              var req = db.transaction("handles", "readonly").objectStore("handles").get(bios);
              req.onsuccess = function () {
                var record = req.result;
                db.close();
                resolve(record && record.bytes ? new File([record.bytes], record.filename || "bios.rom") : null);
              };
              req.onerror = function () { db.close(); resolve(null); };
            });
          }).catch(function () { return null; });
        }

        var loadedRom = null;
        var tpkNote = "";
        var saveNote = "";
        var onSavesStarted = null;
        function restageRom() {
          if (romParam.indexOf(IDB_ROM_PREFIX) !== 0 || !(loadedRom instanceof File)) return Promise.resolve();
          var key = romParam.slice(IDB_ROM_PREFIX.length);
          return loadedRom.arrayBuffer().then(function (bytes) {

                      var meta = document.getElementById("meta");
                      meta.textContent = metaPrefix + " · " + text;
                      meta.title = text;
                    },
                  });
                });
              })
            : Promise.resolve();
          // Battery saves: record where this game's save lives, and put in a save file
          // chosen on the game page (?gid=<library id>).
          var gameSaves = params.get("gid")
            ? import("./game-saves.js").then(function (module) {
                onSavesStarted = module.installGameSaves(params.get("gid"), {
                  onStatus: function (text) {
                    saveNote = text;
                    document.getElementById("meta").textContent = metaPrefix + " · " + text;
                  },
                });
              })
            : Promise.resolve();
          // EmulatorJS's "tap to resume" prompt has no title and its translator turns that into the
          // word "undefined"; on a first launch nothing is being resumed either. Tidy both.
          var emulatorText = import("./ejs-start-hooks.js").then(function (module) {
            module.beforeCoreStart(function (emulator) {
              if (typeof emulator.localization !== "function" || emulator.__roText) return;
              emulator.__roText = true;
              var translate = emulator.localization.bind(emulator);
              var plain = { "Tap to resume Emulator": "Tap to play", "Click to resume Emulator": "Click to play" };
              emulator.localization = function (text, log) {
                if (text === undefined || text === null || text === "") return "";
                var out = translate(text, log);
                if (Object.prototype.hasOwnProperty.call(plain, text) && out === text) return plain[text];
                return out === undefined ? "" : out;
              };
            });
          }).catch(function () { /* cosmetic only */ });
          // EmulatorJS's own Netplay, when this page comes from the RetroOasis host app (which runs
          // its server). Not for a room host: that page streams through RetroOasis rooms instead.
          // Both players get the same numeric game id from the system and name, so they see each
          // other's rooms; the socket.io client is pointed at the host app's netplay endpoint.
          var netplaySetup = params.get("lanhost") === "1" ? Promise.resolve() : (function () {
            var timeout = new Promise(function (resolve) { setTimeout(function () { resolve(null); }, 1500); });
            var probe = fetch("./api/lan", { cache: "no-store" }).then(function (r) { return r.ok ? r.json() : null; }).catch(function () { return null; });
            return Promise.race([probe, timeout]).then(function (lan) {
              if (!lan || !lan.available) return;
              var key = (core + ":" + name).toLowerCase().replace(/\s+/g, " ").trim();
              var hash = 2166136261;
              for (var i = 0; i < key.length; i++) { hash ^= key.charCodeAt(i); hash = Math.imul(hash, 16777619); }
              window.EJS_gameID = (hash >>> 1) || 1;
              window.EJS_netplayServer = location.origin + "/netplay";
              var server = window.EJS_netplayServer;
              var realIo;
              Object.defineProperty(window, "io", {
                configurable: true,
                get: function () {
                  if (!realIo) return realIo;
                  return function (url, options) {
                    if (typeof url === "string" && url.indexOf(server) === 0) {
                      options = Object.assign({ path: "/netplay-io/", transports: ["websocket"] }, options);
                    }
                    return realIo(url, options);
                  };
                },
                set: function (value) { realIo = value; },
              });
            });
          })();
          return Promise.all([gameSaves, transferPak, emulatorText, netplaySetup]).then(function () {
            if (params.get("lanhost") === "1") {
              return import("./lan-host.js").then(function (module) {
                module.installLanHost();
                document.body.appendChild(script);
              });
            }
            document.body.appendChild(script);
          });
        }

        // A .chd made from a Dreamcast GD-ROM or a DVD would start a CD core and sit on a blank screen.
        function explainDiscImage(file) {
          if (core === "ppsspp" && file instanceof Blob && /\.chd$/i.test(file.name || "")) {
            return Promise.resolve("The PSP emulator in the browser can’t open .chd files. Convert the game to .iso or .cso first (chdman extractdvd gives an .iso), then add that.");
          }
          var cdCores = { psx: 1, segaCD: 1, segaSaturn: 1 };
          if (!cdCores[core] || !(file instanceof Blob) || !/\.chd$/i.test(file.name || "")) return Promise.resolve(null);
          return file.slice(0, 124).arrayBuffer().then(function (buffer) {
            var view = new DataView(buffer);
            if (view.byteLength < 124 || String.fromCharCode.apply(null, new Uint8Array(buffer, 0, 8)) !== "MComprHD" || view.getUint32(12) !== 5) return null;
            var offset = Number(view.getBigUint64(48));
            var walk = function (step) {
              if (!offset || step > 16 || offset + 16 > file.size) return Promise.resolve(null);
              return file.slice(offset, offset + 16).arrayBuffer().then(function (chunk) {
                var entry = new DataView(chunk);
                var tag = String.fromCharCode(entry.getUint8(0), entry.getUint8(1), entry.getUint8(2), entry.getUint8(3));
                if (tag === "CHGD" || tag === "CHGT") return "This is a Dreamcast disc image (GD-ROM). RetroOasis can’t play Dreamcast games yet.";
                if (tag === "DVD ") return "This is a DVD-sized disc image (PlayStation 2, GameCube, Xbox or similar). RetroOasis can’t play those yet.";
                if (tag === "CHCD" || tag === "CHTR" || tag === "CHT2") return null;
                offset = Number(entry.getBigUint64(8));
                return walk(step + 1);
              });
            };
            return walk(0);
          }).catch(function () { return null; });
        }

        if (!romParam || !core) {
          fail("Can’t start", "Missing the game file or system. Go back and try Play again.");
          return;
        }

        document.getElementById("meta").textContent = metaPrefix + " · loading…";
        showLoading("Loading ROM…");

        // About 10% of this browser's quota, between 256 MB and 1 GB.
        var emulatorCacheMB = 1024;
        var quotaCheck = navigator.storage && navigator.storage.estimate
          ? navigator.storage.estimate().then(function (estimate) {
              if (estimate && estimate.quota > 0) {
                emulatorCacheMB = Math.round(Math.max(256, Math.min(1024, estimate.quota * 0.1 / 1048576)));
              }
            }).catch(function () {})
          : Promise.resolve();

        Promise.all([resolveRom(romParam), quotaCheck, resolveBios()])
          .then(function (results) { biosFile = results[2]; return results[0]; })
          .then(function (gameUrl) {
            return explainDiscImage(gameUrl).then(function (problem) {
              if (problem) {
                var error = new Error(problem);
                error.discProblem = true;
                throw error;
              }
              return gameUrl;
            });
          })
          .then(function (gameUrl) {
            document.getElementById("meta").textContent = metaPrefix + " · starting…";
            showLoading("Starting emulator…");
            return startEmulator(gameUrl);
          })
          .catch(function (err) {
            // A failed fetch has no useful text of its own ("Failed to fetch"); say what happened and offer a retry.
            var network = err instanceof TypeError || /failed to fetch|load failed|networkerror/i.test((err && err.message) || "");
            if (network) {
              fail(
                "Can’t reach this game",
                navigator.onLine === false
                  ? "You’re offline, and this game isn’t saved on this device. Reconnect and try again, or add it with Add ROM to keep a copy here."
                  : "The server didn’t send the game file. Check your connection and that the server is still running, then try again.",
                null,
                [{ label: "Try again", run: function () { window.location.reload(); } }]
              );
              return;
            }
            fail(
              err && err.discProblem ? "Can’t play this disc" : "Can’t load ROM",
              (err && err.message) || "Couldn’t load that ROM. Go back and try Play again.",
              err && err.domMessage
            );
          });
      })();
    </script>
  </body>
</html>
