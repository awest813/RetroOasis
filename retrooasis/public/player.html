<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#071018" />
    <title>RetroOasis Play</title>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        background: #000;
        overflow: hidden;
        font-family: "Chakra Petch", system-ui, sans-serif;
      }

      #display {
        width: 100%;
        height: 100%;
      }

      #game {
        width: 100%;
        height: 100%;
      }

      .ro-play-bar {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        z-index: 50;
        display: flex;
        align-items: center;
        gap: 0.75rem;
        padding: 0.55rem 0.85rem;
        background: linear-gradient(180deg, rgba(7, 16, 24, 0.92), rgba(7, 16, 24, 0.35) 70%, transparent);
        color: #e8eef5;
        pointer-events: none;
      }

      .ro-play-bar a,
      .ro-play-bar button {
        pointer-events: auto;
        font: inherit;
        cursor: pointer;
        border: 1px solid #2ee6d6;
        background: rgba(7, 16, 24, 0.85);
        color: #2ee6d6;
        padding: 0.35rem 0.7rem;
        text-decoration: none;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        font-size: 0.75rem;
      }

      .ro-play-bar a:hover,
      .ro-play-bar button:hover {
        background: #2ee6d6;
        color: #071018;
      }

      .ro-play-title {
        font-size: 0.8rem;
        opacity: 0.85;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .ro-play-meta {
        font-size: 0.7rem;
        opacity: 0.65;
      }

      .ro-play-error {
        position: absolute;
        inset: 0;
        display: grid;
        place-content: center;
        gap: 1rem;
        padding: 2rem;
        text-align: center;
        color: #e8eef5;
        background:
          radial-gradient(ellipse at center, #0d2230 0%, #071018 70%),
          #071018;
      }

      .ro-play-error h1 {
        margin: 0;
        font-family: "Press Start 2P", monospace;
        font-size: 0.9rem;
        color: #f0b429;
        line-height: 1.6;
      }

      .ro-play-error p {
        margin: 0;
        max-width: 32rem;
        color: #9aabbc;
      }

      .ro-play-error code {
        color: #2ee6d6;
      }
    </style>
  </head>
  <body>
    <div class="ro-play-bar">
      <a id="back" href="./#/">Exit</a>
      <span class="ro-play-title" id="title"></span>
      <span class="ro-play-meta" id="meta"></span>
    </div>
    <div id="display"><div id="game"></div></div>
    <script>
      (function () {
        const THREADED = new Set(["ppsspp", "psp", "dosbox_pure", "dos", "azahar", "3ds"]);
        const PATHS = {
          local: "data/",
          stable: "https://cdn.emulatorjs.org/stable/data/",
          latest: "https://cdn.emulatorjs.org/latest/data/",
          nightly: "https://cdn.emulatorjs.org/nightly/data/",
        };
        const DB_NAME = "retrooasis";
        const DB_VERSION = 3;
        const PENDING_ROM_STORE = "pendingRoms";
        const LIBRARY_ROM_STORE = "libraryRoms";
        const IDB_ROM_PREFIX = "idb:";
        const LIBRARY_ROM_PREFIX = "library:";

        const params = new URLSearchParams(window.location.search);
        const romParam = params.get("rom") || "";
        let core = params.get("core") || "";
        const name = params.get("name") || "Game";
        const bios = params.get("bios") || "";
        let back = params.get("back") || "./#/";
        if (back.toLowerCase().startsWith('javascript:')) back = "./#/";
        let channel = params.get("channel") || "stable";
        if (!PATHS[channel]) channel = "stable";

        if (core === "psp") core = "ppsspp";
        if (core === "dos") core = "dosbox_pure";
        if (core === "3ds") core = "azahar";

        const needsThreads = THREADED.has(core);
        // PSP / PPSSPP, DOS, and 3DS need nightly CDN builds (stable lacks these cores).
        if (needsThreads && channel !== "local") channel = "nightly";

        const dataPath = PATHS[channel];
        document.getElementById("title").textContent = name;
        document.getElementById("meta").textContent = core + " · " + channel;
        document.getElementById("back").setAttribute("href", back);
        document.title = name + " · RetroOasis";

        function fail(title, message) {
          document.getElementById("display").innerHTML =
            '<div class="ro-play-error"><h1>' +
            escapeHtml(title) +
            "</h1><p>" +
            escapeHtml(message) +
            '</p><a href="' +
            escapeHtml(back) +
            '">Back to Oasis</a></div>';
        }

        function escapeHtml(value) {
          return String(value)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;");
        }

        function openDb() {
          return new Promise(function (resolve, reject) {
            var req = indexedDB.open(DB_NAME, DB_VERSION);
            req.onupgradeneeded = function () {
              var db = req.result;
              if (!db.objectStoreNames.contains("handles")) {
                db.createObjectStore("handles");
              }
              if (!db.objectStoreNames.contains(PENDING_ROM_STORE)) {
                db.createObjectStore(PENDING_ROM_STORE);
              }
              if (!db.objectStoreNames.contains(LIBRARY_ROM_STORE)) {
                db.createObjectStore(LIBRARY_ROM_STORE);
              }
            };
            req.onsuccess = function () {
              resolve(req.result);
            };
            req.onerror = function () {
              reject(req.error || new Error("IndexedDB open failed"));
            };
          });
        }

        function takeStagedRom(romRef) {
          var key = romRef.slice(IDB_ROM_PREFIX.length);
          return openDb().then(function (db) {
            return new Promise(function (resolve, reject) {
              var tx = db.transaction(PENDING_ROM_STORE, "readwrite");
              var store = tx.objectStore(PENDING_ROM_STORE);
              var getReq = store.get(key);
              getReq.onsuccess = function () {
                var record = getReq.result;
                if (!record || !record.bytes) {
                  reject(new Error("This play session expired. Go back and press Play again."));
                  return;
                }
                store.delete(key);
                resolve(
                  new File([record.bytes], record.filename || "game.bin", {
                    type: record.type || "application/octet-stream",
                  }),
                );
              };
              getReq.onerror = function () {
                reject(getReq.error || new Error("IndexedDB read failed"));
              };
              tx.oncomplete = function () {
                db.close();
              };
            });
          });
        }

        function readLibraryRom(romRef) {
          var key = romRef.slice(LIBRARY_ROM_PREFIX.length);
          return openDb().then(function (db) {
            return new Promise(function (resolve, reject) {
              var tx = db.transaction(LIBRARY_ROM_STORE, "readonly");
              var store = tx.objectStore(LIBRARY_ROM_STORE);
              var getReq = store.get(key);
              getReq.onsuccess = function () {
                var record = getReq.result;
                if (!record || !record.bytes) {
                  reject(
                    new Error(
                      "That saved ROM isn’t on this device anymore. Go back and add it again from Add ROM.",
                    ),
                  );
                  return;
                }
                resolve(
                  new File([record.bytes], record.filename || "game.bin", {
                    type: record.type || "application/octet-stream",
                  }),
                );
              };
              getReq.onerror = function () {
                reject(getReq.error || new Error("IndexedDB read failed"));
              };
              tx.oncomplete = function () {
                db.close();
              };
            });
          });
        }

        function resolveRom(rom) {
          if (!rom) return Promise.reject(new Error("Missing game file. Go back and try again."));
          // Dead blob URLs from a previous document cannot be fetched after navigation.
          if (rom.indexOf("blob:") === 0) {
            return Promise.reject(
              new Error("This play link expired. Go back and press Play again."),
            );
          }
          if (rom.indexOf(IDB_ROM_PREFIX) === 0) {
            return takeStagedRom(rom);
          }
          if (rom.indexOf(LIBRARY_ROM_PREFIX) === 0) {
            return readLibraryRom(rom);
          }
          // Hosted / relative paths: fail fast with a clear message instead of EmulatorJS "Network Error".
          return fetch(rom, { method: "GET", cache: "no-store" }).then(function (res) {
            if (!res.ok) {
              throw new Error(
                "Couldn’t find that ROM file" +
                  (rom ? " at <code>" + escapeHtml(rom) + "</code>" : "") +
                  ". Host it with your site, link a folder, or use Add ROM.",
              );
            }
            var type = (res.headers.get("content-type") || "").toLowerCase();
            if (type.indexOf("text/html") === 0) {
              throw new Error(
                "That path isn’t a ROM file — the server sent a web page instead" +
                  (rom ? " (<code>" + escapeHtml(rom) + "</code>)" : "") +
                  ". Check that the file is hosted in the right place.",
              );
            }
            return res.arrayBuffer().then(function (bytes) {
              var filename = rom.split("/").pop().split("?")[0] || "game.bin";
              return new File([bytes], decodeURIComponent(filename), {
                type: type || "application/octet-stream",
              });
            });
          });
        }

        function startEmulator(gameUrl) {
          if (needsThreads && typeof SharedArrayBuffer === "undefined") {
            fail(
              "NEEDS EXTRA SETUP",
              "This system (PSP, DOS, or 3DS) needs special browser security headers to run. " +
                "The RetroOasis dev server turns them on for you. On a static host, enable COOP/COEP " +
                "(see the README), or try a different game.",
            );
            return;
          }

          window.EJS_player = "#game";
          window.EJS_gameName = name;
          // File objects keep the original filename (extension) for EmulatorJS.
          window.EJS_gameUrl = gameUrl;
          window.EJS_core = core;
          window.EJS_biosUrl = bios;
          window.EJS_pathtodata = dataPath;
          window.EJS_startOnLoaded = true;
          window.EJS_askBeforeExit = false;
          window.EJS_threads = needsThreads;
          window.EJS_onExit = function () {
            window.location.href = back;
          };

          var script = document.createElement("script");
          script.src = dataPath + "loader.js";
          script.onerror = function () {
            fail(
              "EMULATOR MISSING",
              "Couldn’t load the emulator files from <code>" +
                dataPath +
                "</code>. " +
                "If you’re using the Local channel, put EmulatorJS’s <code>data/</code> folder next to this site. " +
                "Otherwise open Settings and switch EmulatorJS channel to Stable (or Nightly for PSP / 3DS / DOS).",
            );
          };
          document.body.appendChild(script);
        }

        if (!romParam || !core) {
          fail("CAN’T START", "Missing the game file or system. Go back and try Play again.");
          return;
        }

        document.getElementById("meta").textContent = core + " · " + channel + " · loading rom…";

        resolveRom(romParam)
          .then(function (gameUrl) {
            document.getElementById("meta").textContent = core + " · " + channel;
            startEmulator(gameUrl);
          })
          .catch(function (err) {
            fail(
              "CAN’T LOAD ROM",
              (err && err.message) ||
                "Couldn’t load that ROM. Go back and try Play again.",
            );
          });
      })();
    </script>
  </body>
</html>
