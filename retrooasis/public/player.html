<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#071018" />
    <meta name="color-scheme" content="dark" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="RetroOasis" />
    <title>RetroOasis Play</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Sora:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        color-scheme: dark;
        --ro-bg-void: #071018;
        --ro-bg-void-mid: #0c1c28;
        --ro-accent-sega: #2ee6d6;
        --ro-accent-ps: #f0b429;
        --ro-accent: var(--ro-accent-sega);
        --ro-text: #e8eef5;
        --ro-text-dim: #9aabbc;
        --ro-font-display: "Outfit", system-ui, sans-serif;
        --ro-font-ui: "Sora", system-ui, sans-serif;
        --ro-radius: 2px;
      }

      html[data-accent="ps"] {
        --ro-accent: var(--ro-accent-ps);
      }

      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        height: 100dvh;
        background: #000;
        overflow: hidden;
        font-family: var(--ro-font-ui);
      }

      #display {
        width: 100%;
        height: 100%;
      }

      #game {
        width: 100%;
        height: 100%;
      }

      /* Phones held upright draw the game from the top (the on-screen pad sits below it),
         so the game starts under the bar instead of behind it. */
      @media (orientation: portrait) and (pointer: coarse) {
        #display {
          box-sizing: border-box;
          padding-top: calc(max(0.55rem, env(safe-area-inset-top, 0px)) + 2.9rem);
        }
      }

      .ro-play-bar {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        z-index: 50;
        display: flex;
        align-items: center;
        gap: 0.75rem;
        padding:
          max(0.55rem, env(safe-area-inset-top, 0px))
          max(0.85rem, env(safe-area-inset-right, 0px))
          0.55rem
          max(0.85rem, env(safe-area-inset-left, 0px));
        background: linear-gradient(
          180deg,
          color-mix(in srgb, var(--ro-bg-void) 92%, transparent),
          color-mix(in srgb, var(--ro-bg-void) 35%, transparent) 70%,
          transparent
        );
        color: var(--ro-text);
        pointer-events: none;
      }

      .ro-play-bar a,
      .ro-play-bar button {
        pointer-events: auto;
        font: inherit;
        cursor: pointer;
        border: 1px solid var(--ro-accent);
        background: color-mix(in srgb, var(--ro-bg-void) 85%, transparent);
        color: var(--ro-accent);
        padding: 0.35rem 0.7rem;
        text-decoration: none;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        font-size: 0.75rem;
        font-weight: 600;
        border-radius: var(--ro-radius);
      }

      .ro-play-bar a:hover,
      .ro-play-bar button:hover {
        background: var(--ro-accent);
        color: var(--ro-bg-void);
      }

      .ro-play-title {
        font-size: 0.8rem;
        opacity: 0.85;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .ro-play-meta {
        font-size: 0.7rem;
        opacity: 0.65;
      }

      .ro-play-error {
        position: absolute;
        inset: 0;
        display: grid;
        place-content: center;
        gap: 1rem;
        padding: 2rem;
        text-align: center;
        color: var(--ro-text);
        background:
          radial-gradient(ellipse at center, var(--ro-bg-void-mid) 0%, var(--ro-bg-void) 70%),
          var(--ro-bg-void);
      }

      .ro-play-error h1 {
        margin: 0;
        font-family: var(--ro-font-display);
        font-size: clamp(1.05rem, 2.5vw, 1.35rem);
        font-weight: 650;
        color: var(--ro-accent);
        line-height: 1.4;
        letter-spacing: 0.04em;
      }

      .ro-play-error p {
        margin: 0;
        max-width: 32rem;
        color: var(--ro-text-dim);
      }

      .ro-play-error code {
        color: var(--ro-accent);
      }

      .ro-play-error a {
        color: var(--ro-accent);
        text-decoration: none;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        font-size: 0.78rem;
        font-weight: 600;
      }

      .ro-play-error a:hover,
      .ro-play-error button:hover {
        text-decoration: underline;
      }

      .ro-play-error__actions {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        align-items: center;
        gap: 0.75rem 1.5rem;
      }

      .ro-play-error button {
        padding: 0.5rem 0.9rem;
        border: 1px solid var(--ro-accent);
        border-radius: 999px;
        background: transparent;
        color: var(--ro-accent);
        font: inherit;
        font-size: 0.78rem;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        cursor: pointer;
      }

      .ro-play-loading {
        position: absolute;
        inset: 0;
        display: grid;
        place-content: center;
        gap: 0.85rem;
        padding: 2rem;
        text-align: center;
        color: var(--ro-text);
        background:
          radial-gradient(ellipse at center, var(--ro-bg-void-mid) 0%, var(--ro-bg-void) 70%),
          var(--ro-bg-void);
      }

      .ro-play-loading p {
        margin: 0;
        color: var(--ro-text-dim);
        font-size: 0.92rem;
      }

      .ro-play-loading__bar {
        width: min(12rem, 55vw);
        height: 3px;
        margin: 0 auto;
        border-radius: 999px;
        background: color-mix(in srgb, var(--ro-text) 12%, transparent);
        overflow: hidden;
      }

      .ro-play-loading__bar > span {
        display: block;
        width: 40%;
        height: 100%;
        background: var(--ro-accent);
        animation: ro-play-load 1.1s ease-in-out infinite;
      }

      @keyframes ro-play-load {
        0% { transform: translateX(-120%); }
        100% { transform: translateX(320%); }
      }

      .ro-play-bar a:focus-visible,
      .ro-play-error a:focus-visible,
      .ro-play-error button:focus-visible {
        outline: 2px solid var(--ro-accent);
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <div class="ro-play-bar">
      <a id="back" href="./#/">Exit</a>
      <span class="ro-play-title" id="title"></span>
      <span class="ro-play-meta" id="meta"></span>
    </div>
    <div id="display"><div id="game"></div></div>
    <script>
      (function () {
        // EmulatorJS asks to keep the screen awake and doesn't handle a refusal (battery
        // saver, some browsers); the game runs the same either way.
        window.addEventListener("unhandledrejection", function (event) {
          if (/wake lock/i.test(String(event.reason && event.reason.message))) event.preventDefault();
        });
        try {
          var storedAccent = localStorage.getItem("retrooasis.accent");
          document.documentElement.dataset.accent = storedAccent === "ps" ? "ps" : "sega";
        } catch (_) {
          document.documentElement.dataset.accent = "sega";
        }

        const THREADED = new Set(["ppsspp", "psp", "dosbox_pure", "dos", "azahar", "3ds"]);
        const PATHS = {
          local: "data/",
          stable: "https://cdn.emulatorjs.org/stable/data/",
          latest: "https://cdn.emulatorjs.org/latest/data/",
          nightly: "https://cdn.emulatorjs.org/nightly/data/",
        };
        const DB_NAME = "retrooasis";
        const DB_VERSION = 3;
        const PENDING_ROM_STORE = "pendingRoms";
        const LIBRARY_ROM_STORE = "libraryRoms";
        const IDB_ROM_PREFIX = "idb:";
        const LIBRARY_ROM_PREFIX = "library:";

        const params = new URLSearchParams(window.location.search);
        const romParam = params.get("rom") || "";
        let core = params.get("core") || "";
        const name = params.get("name") || "Game";
        const bios = params.get("bios") || "";
        function sanitizeBack(raw) {
          if (!raw) return "./#/";
          var cleaned = String(raw).replace(/[\x00-\x20\x7f]/g, "");
          var lower = cleaned.toLowerCase();
          if (
            lower.indexOf("javascript:") === 0 ||
            lower.indexOf("vbscript:") === 0 ||
            lower.indexOf("data:") === 0 ||
            lower.indexOf("file:") === 0 ||
            lower.indexOf("blob:") === 0
          ) {
            return "./#/";
          }
          if (cleaned.indexOf("//") === 0 || /^[a-z][a-z0-9+.-]*:/i.test(cleaned)) {
            return "./#/";
          }
          if (cleaned.charAt(0) === "#") return "./" + cleaned;
          if (cleaned.indexOf("./#") === 0 || cleaned.indexOf("/#") === 0) return cleaned;
          return "./#/";
        }
        var back = sanitizeBack(params.get("back"));
        let channel = params.get("channel") || "stable";
        if (!PATHS[channel]) channel = "stable";

        if (core === "psp") core = "ppsspp";
        if (core === "dos") core = "dosbox_pure";
        if (core === "3ds") core = "azahar";

        const needsThreads = THREADED.has(core);
        // PSP / PPSSPP, DOS, and 3DS need nightly CDN builds (stable lacks these cores).
        if (needsThreads && channel !== "local") channel = "nightly";

        const CHANNEL_LABELS = {
          local: "Local",
          stable: "Stable",
          latest: "Latest",
          nightly: "Nightly",
        };
        const channelLabel = params.get("lanhost") === "1" ? "Online room" : CHANNEL_LABELS[channel] || channel;
        // People-facing system names for the top bar (the core key stays internal).
        const SYSTEM_NAMES = { nes: "NES", snes: "SNES", gb: "Game Boy", gba: "Game Boy Advance", nds: "Nintendo DS", n64: "Nintendo 64", vb: "Virtual Boy", psx: "PlayStation", psp: "PSP", segaMD: "Mega Drive", segaMS: "Master System", segaGG: "Game Gear", segaCD: "Sega CD", sega32x: "32X", segaSaturn: "Saturn", arcade: "Arcade", mame2003: "Arcade", atari2600: "Atari 2600", atari7800: "Atari 7800", lynx: "Lynx", jaguar: "Jaguar", pce: "PC Engine", ngp: "Neo Geo Pocket", ws: "WonderSwan", dos: "DOS", dosbox_pure: "DOS", ppsspp: "PSP", "3ds": "3DS", azahar: "3DS" };

        const dataPath = PATHS[channel];
        document.getElementById("title").textContent = name;
        document.getElementById("meta").textContent = (SYSTEM_NAMES[core] || core) + " · " + channelLabel;
        document.getElementById("back").setAttribute("href", back);
        document.title = name + " · RetroOasis";

        function fail(title, message, domMessage, actions) {
          var display = document.getElementById("display");
          display.textContent = ""; // clear

          var container = document.createElement("div");
          container.className = "ro-play-error";

          var h1 = document.createElement("h1");
          h1.textContent = title;

          var p = document.createElement("p");
          if (domMessage) {
            p.appendChild(domMessage);
          } else {
            p.textContent = message;
          }

          var a = document.createElement("a");
          a.href = back;
          a.textContent = "Back";

          container.appendChild(h1);
          container.appendChild(p);
          if (actions && actions.length) {
            var row = document.createElement("div");
            row.className = "ro-play-error__actions";
            actions.forEach(function (action) {
              var button = document.createElement("button");
              button.type = "button";
              button.textContent = action.label;
              button.addEventListener("click", action.run);
              row.appendChild(button);
            });
            row.appendChild(a);
            container.appendChild(row);
            display.appendChild(container);
            row.querySelector("button").focus({ preventScroll: true });
            return;
          }
          container.appendChild(a);
          display.appendChild(container);
        }

        function showLoading(message) {
          var display = document.getElementById("display");
          display.textContent = "";

          var container = document.createElement("div");
          container.className = "ro-play-loading";
          container.setAttribute("role", "status");
          container.setAttribute("aria-live", "polite");

          var p = document.createElement("p");
          p.textContent = message;

          var bar = document.createElement("div");
          bar.className = "ro-play-loading__bar";
          bar.setAttribute("aria-hidden", "true");

          var span = document.createElement("span");
          bar.appendChild(span);

          container.appendChild(p);
          container.appendChild(bar);
          display.appendChild(container);
        }

        function openDb() {
          return new Promise(function (resolve, reject) {
            var req = indexedDB.open(DB_NAME, DB_VERSION);
            req.onupgradeneeded = function () {
              var db = req.result;
              if (!db.objectStoreNames.contains("handles")) {
                db.createObjectStore("handles");
              }
              if (!db.objectStoreNames.contains(PENDING_ROM_STORE)) {
                db.createObjectStore(PENDING_ROM_STORE);
              }
              if (!db.objectStoreNames.contains(LIBRARY_ROM_STORE)) {
                db.createObjectStore(LIBRARY_ROM_STORE);
              }
            };
            req.onsuccess = function () {
              resolve(req.result);
            };
            req.onerror = function () {
              reject(req.error || new Error("IndexedDB open failed"));
            };
          });
        }

        function takeStagedRom(romRef) {
          var key = romRef.slice(IDB_ROM_PREFIX.length);
          return openDb().then(function (db) {
            return new Promise(function (resolve, reject) {
              var tx = db.transaction(PENDING_ROM_STORE, "readwrite");
              var store = tx.objectStore(PENDING_ROM_STORE);
              var getReq = store.get(key);
              getReq.onsuccess = function () {
                var record = getReq.result;
                if (!record || !record.bytes) {
                  reject(new Error("This play session expired. Go back and press Play again."));
                  return;
                }
                store.delete(key);
                resolve(
                  new File([record.bytes], record.filename || "game.bin", {
                    type: record.type || "application/octet-stream",
                  }),
                );
              };
              getReq.onerror = function () {
                reject(getReq.error || new Error("IndexedDB read failed"));
              };
              tx.oncomplete = function () {
                db.close();
              };
            });
          });
        }

        function readLibraryRom(romRef) {
          var key = romRef.slice(LIBRARY_ROM_PREFIX.length);
          return openDb().then(function (db) {
            return new Promise(function (resolve, reject) {
              var tx = db.transaction(LIBRARY_ROM_STORE, "readonly");
              var store = tx.objectStore(LIBRARY_ROM_STORE);
              var getReq = store.get(key);
              getReq.onsuccess = function () {
                var record = getReq.result;
                if (!record || !record.bytes) {
                  reject(
                    new Error(
                      "That saved ROM isn’t on this device anymore. Go back and add it again from Add ROM.",
                    ),
                  );
                  return;
                }
                resolve(
                  new File([record.bytes], record.filename || "game.bin", {
                    type: record.type || "application/octet-stream",
                  }),
                );
              };
              getReq.onerror = function () {
                reject(getReq.error || new Error("IndexedDB read failed"));
              };
              tx.oncomplete = function () {
                db.close();
              };
            });
          });
        }

        function parseDiscRefs(filename, text) {
          var ext = (filename.split(".").pop() || "").toLowerCase();
          var names = [];
          if (ext === "m3u") {
            text.split(/\r?\n/).forEach(function (raw) {
              var line = raw.trim();
              if (line && line.charAt(0) !== "#") names.push(line.replace(/\\/g, "/"));
            });
            return names;
          }
          if (ext !== "cue" && ext !== "ccd" && ext !== "toc") return names;
          var re = /^\s*FILE\s+(?:"([^"]+)"|'([^']+)'|(\S+))\s+/gim;
          var match;
          while ((match = re.exec(text))) {
            var name = (match[1] || match[2] || match[3] || "").trim();
            if (name) names.push(name.replace(/\\/g, "/"));
          }
          return names;
        }

        function crc32(data) {
          var table = crc32.table;
          if (!table) {
            table = new Uint32Array(256);
            for (var i = 0; i < 256; i++) {
              var c = i;
              for (var k = 0; k < 8; k++) c = c & 1 ? 0xedb88320 ^ (c >>> 1) : c >>> 1;
              table[i] = c >>> 0;
            }
            crc32.table = table;
          }
          var crc = 0xffffffff;
          for (var n = 0; n < data.length; n++) crc = table[(crc ^ data[n]) & 0xff] ^ (crc >>> 8);
          return (crc ^ 0xffffffff) >>> 0;
        }

        function u16(n) {
          return new Uint8Array([n & 0xff, (n >>> 8) & 0xff]);
        }
        function u32(n) {
          return new Uint8Array([n & 0xff, (n >>> 8) & 0xff, (n >>> 16) & 0xff, (n >>> 24) & 0xff]);
        }
        function concatBytes(parts) {
          var total = 0;
          for (var i = 0; i < parts.length; i++) total += parts[i].length;
          var out = new Uint8Array(total);
          var at = 0;
          for (var j = 0; j < parts.length; j++) {
            out.set(parts[j], at);
            at += parts[j].length;
          }
          return out;
        }

        function buildStoreZip(entries) {
          var encoder = new TextEncoder();
          var locals = [];
          var centrals = [];
          var offset = 0;
          var now = new Date();
          var time = (now.getHours() << 11) | (now.getMinutes() << 5) | Math.floor(now.getSeconds() / 2);
          var date = ((Math.max(1980, now.getFullYear()) - 1980) << 9) | ((now.getMonth() + 1) << 5) | now.getDate();
          for (var i = 0; i < entries.length; i++) {
            var nameBytes = encoder.encode(entries[i].name);
            var bytes = entries[i].bytes;
            var crc = crc32(bytes);
            var size = bytes.byteLength;
            var local = concatBytes([
              encoder.encode("PK\x03\x04"),
              u16(20),
              u16(0),
              u16(0),
              u16(time),
              u16(date),
              u32(crc),
              u32(size),
              u32(size),
              u16(nameBytes.length),
              u16(0),
              nameBytes,
              bytes,
            ]);
            var central = concatBytes([
              encoder.encode("PK\x01\x02"),
              u16(20),
              u16(20),
              u16(0),
              u16(0),
              u16(time),
              u16(date),
              u32(crc),
              u32(size),
              u32(size),
              u16(nameBytes.length),
              u16(0),
              u16(0),
              u16(0),
              u16(0),
              u32(0),
              u32(offset),
              nameBytes,
            ]);
            locals.push(local);
            centrals.push(central);
            offset += local.byteLength;
          }
          var centralDir = concatBytes(centrals);
          var eocd = concatBytes([
            encoder.encode("PK\x05\x06"),
            u16(0),
            u16(0),
            u16(entries.length),
            u16(entries.length),
            u32(centralDir.byteLength),
            u32(offset),
            u16(0),
          ]);
          return concatBytes(locals.concat([centralDir, eocd]));
        }

        function fetchAsFile(url) {
          return fetch(url, { method: "GET", cache: "no-store" }).then(function (res) {
            if (!res.ok) return null;
            var type = (res.headers.get("content-type") || "").toLowerCase();
            if (type.indexOf("text/html") === 0) return null;
            return res.arrayBuffer().then(function (bytes) {
              var filename = decodeURIComponent(url.split("/").pop().split("?")[0] || "track.bin");
              return new File([bytes], filename, { type: type || "application/octet-stream" });
            });
          }).catch(function () {
            return null;
          });
        }

        function discLeaf(name) {
          return (name || "").replace(/\\/g, "/").split("/").pop() || name;
        }

        function maybeBundleHostedDisc(rom, primary) {
          var ext = (primary.name.split(".").pop() || "").toLowerCase();
          if (ext !== "cue" && ext !== "ccd" && ext !== "m3u" && ext !== "toc") {
            return Promise.resolve(primary);
          }
          var dir = rom.split("?")[0];
          var slash = dir.lastIndexOf("/");
          dir = slash >= 0 ? dir.slice(0, slash + 1) : "./";
          var seen = {};
          var extras = [];
          var missing = [];

          function walk(filename, text) {
            var refs = parseDiscRefs(filename, text);
            var next = [];
            refs.forEach(function (ref) {
              var leaf = discLeaf(ref);
              if (!leaf) return;
              var key = leaf.toLowerCase();
              if (key === primary.name.toLowerCase() || seen[key]) return;
              seen[key] = true;
              next.push(leaf);
            });
            if (!next.length) return Promise.resolve();
            return Promise.all(
              next.map(function (leaf) {
                return fetchAsFile(dir + encodeURIComponent(leaf)).then(function (file) {
                  return { leaf: leaf, file: file };
                });
              }),
            ).then(function (results) {
              var nested = [];
              results.forEach(function (result) {
                if (!result.file) {
                  missing.push(result.leaf);
                  return;
                }
                extras.push(result.file);
                var childExt = (result.file.name.split(".").pop() || "").toLowerCase();
                if (childExt === "cue" || childExt === "ccd" || childExt === "m3u" || childExt === "toc") {
                  nested.push(result.file);
                }
              });
              return nested.reduce(function (chain, file) {
                return chain.then(function () {
                  if (file.size > 2000000) return;
                  return file.text().then(function (text) {
                    return walk(file.name, text);
                  });
                });
              }, Promise.resolve());
            });
          }

          return primary.text().then(function (text) {
            return walk(primary.name, text).then(function () {
              if (missing.length) {
                var list = missing.slice(0, 4).join(", ");
                var extra = missing.length > 4 ? " (+" + (missing.length - 4) + " more)" : "";
                return Promise.reject(
                  new Error(primary.name + " also needs " + list + extra + ". Host those files next to this one."),
                );
              }
              if (!extras.length) return primary;
              return Promise.all(
                [primary].concat(extras).map(function (file) {
                  return file.arrayBuffer().then(function (buf) {
                    return { name: file.name, bytes: new Uint8Array(buf) };
                  });
                }),
              ).then(function (zipEntries) {
                var zip = buildStoreZip(zipEntries);
                var zipName = primary.name.replace(/\.[^.]+$/, "") + ".zip";
                return new File([zip], zipName, { type: "application/zip" });
              });
            });
          });
        }

        function resolveRom(rom) {
          if (!rom) return Promise.reject(new Error("Missing game file. Go back and try again."));
          // Dead blob URLs from a previous document cannot be fetched after navigation.
          if (rom.indexOf("blob:") === 0) {
            return Promise.reject(
              new Error("This play session expired. Go back and press Play again."),
            );
          }
          if (rom.indexOf(IDB_ROM_PREFIX) === 0) {
            return takeStagedRom(rom);
          }
          if (rom.indexOf(LIBRARY_ROM_PREFIX) === 0) {
            return readLibraryRom(rom);
          }
          // Hosted / relative paths: fail fast with a clear message instead of EmulatorJS "Network Error".
          return fetch(rom, { method: "GET", cache: "no-store" }).then(function (res) {
            if (!res.ok) {
              var err = new Error("Couldn’t find that ROM file.");
              var frag = document.createDocumentFragment();
              frag.appendChild(document.createTextNode("Couldn’t find that ROM file"));
              if (rom) {
                frag.appendChild(document.createTextNode(" at "));
                var code = document.createElement("code");
                code.textContent = rom;
                frag.appendChild(code);
              }
              frag.appendChild(document.createTextNode(". Host it with your site, link a folder, or use Add ROM."));
              err.domMessage = frag;
              throw err;
            }
            var type = (res.headers.get("content-type") || "").toLowerCase();
            if (type.indexOf("text/html") === 0) {
              var errType = new Error("That path isn’t a ROM file — the server sent a web page instead.");
              var fragType = document.createDocumentFragment();
              fragType.appendChild(document.createTextNode("That path isn’t a ROM file — the server sent a web page instead"));
              if (rom) {
                fragType.appendChild(document.createTextNode(" ("));
                var codeType = document.createElement("code");
                codeType.textContent = rom;
                fragType.appendChild(codeType);
                fragType.appendChild(document.createTextNode(")"));
              }
              fragType.appendChild(document.createTextNode(". Check that the file is hosted in the right place."));
              errType.domMessage = fragType;
              throw errType;
            }
            return res.arrayBuffer().then(function (bytes) {
              var filename = rom.split("/").pop().split("?")[0] || "game.bin";
              var file = new File([bytes], decodeURIComponent(filename), {
                type: type || "application/octet-stream",
              });
              return maybeBundleHostedDisc(rom, file);
            });
          });
        }

        var loadedRom = null;
        var tpkNote = "";
        function restageRom() {
          if (romParam.indexOf(IDB_ROM_PREFIX) !== 0 || !(loadedRom instanceof File)) return Promise.resolve();
          var key = romParam.slice(IDB_ROM_PREFIX.length);
          return loadedRom.arrayBuffer().then(function (bytes) {
            return openDb().then(function (db) {
              return new Promise(function (resolve, reject) {
                var tx = db.transaction(PENDING_ROM_STORE, "readwrite");
                tx.objectStore(PENDING_ROM_STORE).put(
                  { key: key, bytes: bytes, filename: loadedRom.name, type: loadedRom.type, createdAt: Date.now() },
                  key,
                );
                tx.oncomplete = function () { db.close(); resolve(); };
                tx.onerror = tx.onabort = function () { db.close(); reject(tx.error); };
              });
            });
          });
        }
        function retry(nextChannel) {
          var url = new URL(window.location.href);
          if (nextChannel) url.searchParams.set("channel", nextChannel);
          showLoading("Restarting…");
          var go = function () { window.location.replace(url.href); };
          restageRom().then(go, go);
        }

        // EmulatorJS's own start errors are terse; explain what happened and what to try.
        function explainStartError(detail) {
          var reason = detail && detail.reason;
          document.getElementById("meta").textContent = (SYSTEM_NAMES[core] || core) + " · " + channelLabel + " · didn’t start";
          var offline = navigator.onLine === false;
          var again = { label: "Try again", run: function () { retry(); } };
          if (reason === "core") {
            if (params.get("lanhost") === "1") {
              fail("Multiplayer core unavailable", "The LAN server didn’t send this system’s prepared core. Prepare it on the host computer, then try again.", null, [again]);
            } else if (offline) {
              fail("You’re offline", "This system’s emulator isn’t saved on this device yet. Connect to the internet and play any game for this system once; after that it starts offline too.", null, [again]);
            } else if (channel === "local") {
              fail("Emulator files missing", "This site has no local emulator files for this system (" + detail.file + "). In Settings → Emulator files, choose Stable.", null, [{ label: "Use Stable", run: function () { retry("stable"); } }]);
            } else {
              var actions = [again];
              if (channel === "stable" || channel === "latest") actions.push({ label: "Try Nightly", run: function () { retry("nightly"); } });
              fail("Couldn’t download the emulator", "The " + channelLabel + " channel didn’t send this system’s emulator (" + detail.file + "). Check your connection and try again" + (actions.length > 1 ? ", or try the Nightly channel for this game." : "."), null, actions);
            }
          } else if (reason === "webgl") {
            fail("Graphics not supported", "This system needs WebGL 2. Turn on hardware acceleration in your browser settings, update your graphics driver, or try another browser.");
          } else if (reason === "version") {
            var newer = [again];
            if (channel !== "stable" && channel !== "local") newer.push({ label: "Use Stable", run: function () { retry("stable"); } });
            fail("Emulator too new", "The " + channelLabel + " channel’s emulator needs a newer RetroOasis player than this site has. Choose Stable in Settings → Emulator files.", null, newer);
          } else if (reason === "runtime") {
            fail("Emulator didn’t start", "The emulator downloaded but couldn’t start. Try again; if it keeps happening, clear the emulator cache in Settings → Data.", null, [again]);
          }
          // Other errors stay on EmulatorJS's screen, which shows its own message and menu.
        }

        function startEmulator(gameUrl) {
          loadedRom = gameUrl;
          if (needsThreads && typeof SharedArrayBuffer === "undefined") {
            fail(
              "Needs extra setup",
              "This system (PSP, DOS, or 3DS) needs special browser security headers to run. " +
                "The RetroOasis dev server turns them on for you. On a static host, enable COOP/COEP " +
                "(see the README), or try a different game.",
            );
            return;
          }

          window.EJS_player = "#game";
          window.EJS_gameName = name;
          // File objects keep the original filename (extension) for EmulatorJS.
          window.EJS_gameUrl = gameUrl;
          window.EJS_core = core;
          window.EJS_biosUrl = bios;
          window.EJS_pathtodata = dataPath;
          // Use the fork's controller fixes for every core download channel.
          window.EJS_paths = Object.assign({}, window.EJS_paths, {
            'emulator.min.js': './emulator/emulator.min.js',
            'emulator.min.css': './emulator/emulator.min.css'
          });
          window.EJS_startOnLoaded = true;
          window.EJS_askBeforeExit = false;
          window.EJS_threads = needsThreads;
          // EmulatorJS caches cores and every game it opens (default: 4 GB for 5 days).
          // Saved ROMs already live in the RetroOasis library, so keep that copy small.
          window.EJS_cacheConfig = { enabled: true, cacheMaxSizeMB: emulatorCacheMB, cacheMaxAgeMins: 7 * 24 * 60 };
          window.EJS_onStartError = explainStartError;
          window.EJS_onExit = function () {
            window.location.href = back;
          };
          window.EJS_onGameStart = function () {
            document.getElementById("meta").textContent = (SYSTEM_NAMES[core] || core) + " · " + channelLabel + " · playing" + (tpkNote ? " · " + tpkNote : "");
          };

          if (params.get("lanhost") === "1") {
            // Load our adapter before EmulatorJS binds its start callback.
            window.EJS_threads = false;
            window.EJS_Buttons = Object.assign({}, window.EJS_Buttons, { netplay: false });
            window.EJS_startOnLoaded = false;
            // Start only from EJS_ready below, after CDN fallback is off: an early click
            // would fetch CDN files (and remember a CDN core report) for a LAN session.
            var hideStart = document.createElement("style");
            hideStart.textContent = ".ejs_start_button { display: none !important; }";
            document.head.appendChild(hideStart);
            window.EJS_ready = async function () {
              var emulator = window.EJS_emulator;
              try {
                var response = await fetch('./api/lan/core?core=' + encodeURIComponent(emulator.getCore()), { cache: 'no-store' });
                var prepared = await response.json();
                if (!response.ok || !prepared.ready) throw new Error(prepared.error || 'Prepare the local multiplayer core first.');
                if (prepared.webgl2 && !emulator.supportsWebgl2) throw new Error('This multiplayer core needs WebGL 2. Enable hardware acceleration or use another browser.');
              } catch (error) {
                fail('Multiplayer core unavailable', error.message || 'Start the LAN server and prepare the core first.');
                return;
              }
              // LAN sessions use locally prepared cores and never fall back to a CDN.
              Object.values(emulator.downloadType || {}).forEach(function (type) { type.cdnFallback = false; });
              var previousSetting = emulator.preGetSetting.bind(emulator);
              emulator.preGetSetting = function (setting) {
                if (setting === "ejs_threads") return "disabled";
                if (prepared.webgl2 && setting === "webgl2Enabled") return "enabled";
                return previousSetting(setting);
              };
              if (prepared.webgl2) emulator.webgl2Enabled = true;
              emulator.startButtonClicked(document.querySelector(".ejs_start_button"));
            };
          }

          var display = document.getElementById("display");
          display.textContent = "";
          var gameDiv = document.createElement("div");
          gameDiv.id = "game";
          display.appendChild(gameDiv);

          var script = document.createElement("script");
          script.src = './emulator/loader.js';
          script.onerror = function () {
            fail(
              "Player files missing",
              "Couldn’t load RetroOasis’s bundled player. Reload this page. If you host RetroOasis yourself, rebuild it and deploy the complete build, including the emulator folder."
            );
          };
          // N64 Transfer Pak (?tpk=<GB / Color game>): plugs the cartridge into Controller 1.
          var transferPak = core === "n64" && params.get("tpk")
            ? import("./transfer-pak.js").then(function (module) {
                // Not showLoading(): that would replace the #game element EmulatorJS mounts into.
                document.getElementById("meta").textContent = (SYSTEM_NAMES[core] || core) + " · " + channelLabel + " · inserting the Game Boy cartridge…";
                return module.loadTransferCart(params.get("tpk")).then(function (cart) {
                  module.installTransferPak(cart, {
                    onStatus: function (text) {
                      tpkNote = text;
                      var meta = document.getElementById("meta");
                      meta.textContent = (SYSTEM_NAMES[core] || core) + " · " + channelLabel + " · " + text;
                      meta.title = text;
                    },
                  });
                });
              })
            : Promise.resolve();
          return transferPak.then(function () {
            if (params.get("lanhost") === "1") {
              return import("./lan-host.js").then(function (module) {
                module.installLanHost();
                document.body.appendChild(script);
              });
            }
            document.body.appendChild(script);
          });
        }

        if (!romParam || !core) {
          fail("Can’t start", "Missing the game file or system. Go back and try Play again.");
          return;
        }

        document.getElementById("meta").textContent = (SYSTEM_NAMES[core] || core) + " · " + channelLabel + " · loading…";
        showLoading("Loading ROM…");

        // About 10% of this browser's quota, between 256 MB and 1 GB.
        var emulatorCacheMB = 1024;
        var quotaCheck = navigator.storage && navigator.storage.estimate
          ? navigator.storage.estimate().then(function (estimate) {
              if (estimate && estimate.quota > 0) {
                emulatorCacheMB = Math.round(Math.max(256, Math.min(1024, estimate.quota * 0.1 / 1048576)));
              }
            }).catch(function () {})
          : Promise.resolve();

        Promise.all([resolveRom(romParam), quotaCheck])
          .then(function (results) { return results[0]; })
          .then(function (gameUrl) {
            document.getElementById("meta").textContent = (SYSTEM_NAMES[core] || core) + " · " + channelLabel + " · starting…";
            showLoading("Starting emulator…");
            return startEmulator(gameUrl);
          })
          .catch(function (err) {
            fail(
              "Can’t load ROM",
              (err && err.message) || "Couldn’t load that ROM. Go back and try Play again.",
              err && err.domMessage
            );
          });
      })();
    </script>
  </body>
</html>
